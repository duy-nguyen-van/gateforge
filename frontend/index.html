<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateForge</title>
    <!-- LCP / body use Manrope; Vite rewrites these to hashed assets on build -->
    <link
      rel="preload"
      href="/src/assets/fonts/manrope-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/manrope-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      try {
        var stored = localStorage.getItem('gateforge-theme')
        var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      html {
        color-scheme: light;
        background: oklch(0.985 0.003 247);
      }
      html.dark {
        color-scheme: dark;
        background: oklch(0.16 0.02 265);
      }
      body {
        margin: 0;
        background: inherit;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: oklch(0.985 0.003 247);
      }
      html.dark .boot-splash {
        background: oklch(0.16 0.02 265);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="boot-splash"
        role="status"
        aria-live="polite"
        aria-label="Loading GateForge"
      >
        <div
          class="boot-splash-mark"
          style="
            position: relative;
            width: 96px;
            height: 96px;
          "
        >
          <img
            src="/gateforge-icon.webp"
            alt=""
            width="96"
            height="96"
            decoding="async"
            style="
              position: relative;
              z-index: 1;
              box-sizing: border-box;
              width: 96px;
              height: 96px;
              padding: 18%;
              object-fit: contain;
            "
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

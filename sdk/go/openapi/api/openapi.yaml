openapi: 3.0.3
info:
  description: "Public HTTP API for GateForge IAM — OpenID Connect / OAuth2 endpoints\
    \ at the server root, plus the application JSON API under `/api/v1` (auth, MFA,\
    \ WebAuthn, tenants, and platform admin). Success responses for `/api/v1` use\
    \ a `{meta, data}` envelope. OAuth token and userinfo errors use `{error, error_description}`."
  title: GateForge IAM API
  version: 0.1.0
servers:
- description: Local development server
  url: http://localhost:3000
tags:
- description: Service and database health
  name: Health
- description: "Registration, login, refresh, logout, session exchange"
  name: Auth
- description: "OpenID Connect discovery, authorize, token, userinfo, browser login"
  name: OIDC
- description: Upstream identity provider federation
  name: Federation
- description: "TOTP enrollment, recovery codes, and login challenges"
  name: MFA
- description: Passkey registration and login
  name: WebAuthn
- description: Current user profile
  name: Users
- description: "Tenant listing, selection, and switching"
  name: Tenants
- description: Platform admin console APIs
  name: Admin
paths:
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JWKS"
          description: JWKS JSON
      summary: JWKS endpoint (JSON Web Key Set)
      tags:
      - OIDC
  /.well-known/openid-configuration:
    get:
      operationId: getOpenIdConfiguration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenIDConfigurationResponse"
          description: OK
      summary: OpenID Configuration endpoint
      tags:
      - OIDC
  /authorize:
    get:
      operationId: authorize
      parameters:
      - description: Response type (code)
        explode: true
        in: query
        name: response_type
        required: false
        schema:
          type: string
        style: form
      - description: Client ID
        explode: true
        in: query
        name: client_id
        required: false
        schema:
          type: string
        style: form
      - description: Redirect URI
        explode: true
        in: query
        name: redirect_uri
        required: false
        schema:
          type: string
        style: form
      - description: Scope
        explode: true
        in: query
        name: scope
        required: false
        schema:
          type: string
        style: form
      - description: State parameter
        explode: true
        in: query
        name: state
        required: false
        schema:
          type: string
        style: form
      - description: Nonce
        explode: true
        in: query
        name: nonce
        required: false
        schema:
          type: string
        style: form
      - description: PKCE code challenge
        explode: true
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
        style: form
      - description: PKCE method (S256)
        explode: true
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
        style: form
      responses:
        "302":
          description: "Redirect to client with code, or to login"
          headers:
            Location:
              description: Redirect target
              explode: false
              schema:
                format: uri
                type: string
              style: simple
      security:
      - CookieAuth: []
      summary: Authorize endpoint (authorization code + PKCE)
      tags:
      - OIDC
  /oidc/login:
    post:
      operationId: loginOidc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "302":
          description: Redirect to return_to with session cookie set
          headers:
            Location:
              description: Redirect target
              explode: false
              schema:
                format: uri
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - CSRFToken: []
      summary: Login (OIDC browser flow) and continue /authorize
      tags:
      - OIDC
  /oidc/federation/{provider}/start:
    get:
      operationId: startFederationOAuth
      parameters:
      - description: Provider id (e.g. google)
        explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      - description: URL to return to after login (must be /authorize on this app)
        explode: true
        in: query
        name: return_to
        required: true
        schema:
          type: string
        style: form
      responses:
        "302":
          description: Redirect to identity provider
          headers:
            Location:
              description: Redirect target
              explode: false
              schema:
                format: uri
                type: string
              style: simple
      summary: Start federated sign-in (OIDC browser flow)
      tags:
      - Federation
  /oidc/federation/{provider}/callback:
    get:
      operationId: callbackFederationOAuth
      parameters:
      - description: Provider id (e.g. google)
        explode: false
        in: path
        name: provider
        required: true
        schema:
          type: string
        style: simple
      - description: Authorization code
        explode: true
        in: query
        name: code
        required: true
        schema:
          type: string
        style: form
      - description: State
        explode: true
        in: query
        name: state
        required: true
        schema:
          type: string
        style: form
      - description: OAuth error code from provider
        explode: true
        in: query
        name: error
        required: false
        schema:
          type: string
        style: form
      - description: OAuth error description from provider
        explode: true
        in: query
        name: error_description
        required: false
        schema:
          type: string
        style: form
      responses:
        "302":
          description: Redirect to stored return_to
          headers:
            Location:
              description: Redirect target
              explode: false
              schema:
                format: uri
                type: string
              style: simple
      summary: Federated OAuth callback
      tags:
      - Federation
  /token:
    post:
      operationId: createToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OIDCTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCTokenResponse"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: Invalid request or grant
      summary: Token endpoint (authorization_code / refresh_token grant)
      tags:
      - OIDC
  /userinfo:
    get:
      operationId: getUserInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthError"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: "Userinfo endpoint (Bearer access token from token endpoint, RS256)"
      tags:
      - OIDC
  /api/v1/:
    get:
      description: Check if the service is running
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
          description: OK
      summary: Health Check
      tags:
      - Health
  /api/v1/health/database:
    get:
      description: Check if the database connection is healthy
      operationId: getDatabaseHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseHealthEnvelope"
          description: OK
      summary: Database Health Check
      tags:
      - Health
  /api/v1/health/metrics:
    get:
      description: Get detailed database connection metrics
      operationId: getDatabaseMetrics
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseMetricsEnvelope"
          description: OK
      summary: Database Connection Metrics
      tags:
      - Health
  /api/v1/register:
    post:
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
      summary: Register a new user
      tags:
      - Auth
  /api/v1/login:
    post:
      description: "Sets the same iam_session cookie as OIDC so /authorize recognizes\
        \ the browser without a second login. If the user has MFA (TOTP) enabled,\
        \ `data` is MFALoginChallengeResponse (mfa_ticket) instead of LoginResponse;\
        \ complete login with POST /api/v1/mfa/challenge/verify. When the user belongs\
        \ to multiple tenants and no tenant context is provided, `data` is TenantSelectionResponse."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResultEnvelope"
          description: "LoginResponse, MFALoginChallengeResponse, or TenantSelectionResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      summary: Login (dashboard/API) with email and password
      tags:
      - Auth
  /api/v1/login/session:
    post:
      description: Reads the browser iam_session cookie and returns JWT tokens for
        the SPA dashboard.
      operationId: exchangeSession
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResultEnvelope"
          description: LoginResponse or TenantSelectionResponse
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - CookieAuth: []
      summary: Exchange iam_session cookie for API tokens (after federated sign-in)
      tags:
      - Auth
  /api/v1/federation/providers:
    get:
      operationId: listFederationProviders
      parameters:
      - description: Tenant UUID (defaults to DEFAULT_TENANT_ID)
        explode: true
        in: query
        name: tenant_id
        required: false
        schema:
          type: string
        style: form
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Page size
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFederationProviderListEnvelope"
          description: OK
      summary: List enabled federation sign-in methods for a tenant
      tags:
      - Federation
  /api/v1/refresh:
    post:
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      summary: Exchange refresh token for a new access token (and rotated refresh
        token)
      tags:
      - Auth
  /api/v1/webauthn/login/start:
    post:
      description: Returns WebAuthn PublicKeyCredentialRequestOptions as `data.options`
        and a `session_token` for login/finish. Public endpoint (rate limited).
      operationId: startWebauthnLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnLoginStartRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnLoginStartEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
      summary: Begin passkey login
      tags:
      - WebAuthn
  /api/v1/webauthn/login/finish:
    post:
      description: "Verifies the assertion. On success without MFA: returns `data`\
        \ as LoginResponse and sets `iam_session` cookie. When MFA is enabled for\
        \ the user, returns MFALoginChallengeResponse in `data` instead (then call\
        \ POST /api/v1/mfa/challenge/verify)."
      operationId: finishWebauthnLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnLoginFinishRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResultEnvelope"
          description: "LoginResponse, MFALoginChallengeResponse, or TenantSelectionResponse"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      summary: Finish passkey login
      tags:
      - WebAuthn
  /api/v1/mfa/challenge/verify:
    post:
      description: "Consumes the `mfa_ticket` from password or passkey login when\
        \ MFA is required. `code` is a 6-digit TOTP, or a recovery code (non–6-digit\
        \ path). On success returns LoginResponse and sets `iam_session` cookie."
      operationId: verifyMfaChallenge
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      summary: Complete MFA after password or passkey login
      tags:
      - MFA
  /api/v1/logout:
    post:
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetaOnlyEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Log out everywhere for the current user (SSO session + all refresh
        tokens)
      tags:
      - Auth
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Current user profile
      tags:
      - Users
    patch:
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /api/v1/me/tenants:
    get:
      operationId: listMyTenants
      parameters:
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Page size
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSummaryListEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List tenants the current user can access
      tags:
      - Tenants
  /api/v1/tenants/select:
    post:
      operationId: selectTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSelectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      summary: Complete login by selecting a tenant
      tags:
      - Tenants
  /api/v1/tenants/switch:
    post:
      operationId: switchTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSwitchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Switch active tenant and re-issue tokens
      tags:
      - Tenants
  /api/v1/webauthn/credentials:
    get:
      description: Returns passkeys registered for the current user (device label
        and created date only).
      operationId: listWebauthnCredentials
      parameters:
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form
      - description: Page size
        explode: true
        in: query
        name: page_size
        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnCredentialListEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: List registered passkeys
      tags:
      - WebAuthn
  /api/v1/webauthn/register/start:
    post:
      operationId: startWebauthnRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnRegisterStartRequest"
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebauthnRegisterStartEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Begin passkey registration
      tags:
      - WebAuthn
  /api/v1/webauthn/register/finish:
    post:
      description: Verifies the attestation and stores the passkey for the current
        user.
      operationId: finishWebauthnRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebauthnRegisterFinishRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Finish passkey registration
      tags:
      - WebAuthn
  /api/v1/mfa/totp/setup:
    post:
      description: "Generates a TOTP secret, persists it (encrypted) as pending, and\
        \ returns the raw secret plus otpauth URI for QR scanning."
      operationId: setupTotp
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFATOTPSetupEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Start TOTP enrollment
      tags:
      - MFA
  /api/v1/mfa/totp/verify:
    post:
      description: Validates a 6-digit code against the pending secret and enables
        TOTP for the user.
      operationId: verifyTotpEnrollment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFATOTPVerifyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyDataEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
      security:
      - BearerAuth: []
      summary: Confirm TOTP enrollment
      tags:
      - MFA
  /api/v1/mfa/recovery-codes:
    post:
      description: Replaces any existing recovery codes. Requires TOTP to be enabled.
        Plain codes are returned once; only hashes are stored.
      operationId: createMfaRecoveryCodes
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFARecoveryCodesEnvelope"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Generate MFA recovery codes
      tags:
      - MFA
  /api/v1/admin/stats:
    get:
      operationId: getAdminStats
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStatsEnvelope"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Forbidden
      security:
      - BearerAuth: []
      summary: Platform admin dashboard stats
      tags:
      - Admin
  /api/v1/admin/users:
    get:
      operationId: listAdminUsers
      parameters:
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          type: integer
        style: form

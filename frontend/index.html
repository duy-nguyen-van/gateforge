<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateForge — Identity & Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- display=block: hide ligature text until the icon font loads (avoids FOUT of names like "person") -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <script>
      // Reveal icons once Material Symbols is available (timeout so a CDN miss never hides them forever)
      ;(function () {
        var ready = false
        function reveal() {
          if (ready) return
          ready = true
          document.documentElement.classList.add('material-symbols-ready')
        }
        function waitForIcons() {
          if (!document.fonts || !document.fonts.load) {
            reveal()
            return
          }
          document.fonts
            .load('24px "Material Symbols Outlined"')
            .then(function (faces) {
              if (faces.length > 0) {
                reveal()
                return
              }
              // Stylesheet may still be in flight — retry briefly
              setTimeout(waitForIcons, 50)
            })
            .catch(reveal)
        }
        waitForIcons()
        setTimeout(reveal, 2500)
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <div
        class="boot-splash"
        role="status"
        aria-live="polite"
        aria-label="Loading GateForge"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: oklch(0.985 0.003 247);
        "
      >
        <div
          class="boot-splash-mark"
          style="
            position: relative;
            width: 96px;
            height: 96px;
            animation: boot-enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
          "
        >
          <span
            class="boot-splash-ring"
            aria-hidden="true"
            style="
              position: absolute;
              inset: 0;
              border-radius: 9999px;
              border: 1.5px solid color-mix(in oklab, oklch(0.72 0.03 250) 70%, transparent);
              box-shadow:
                0 1px 2px color-mix(in oklab, oklch(0.45 0.04 265) 8%, transparent),
                0 8px 24px color-mix(in oklab, oklch(0.45 0.04 265) 10%, transparent);
            "
          ></span>
          <img
            src="/gateforge-icon.webp"
            alt=""
            width="96"
            height="96"
            decoding="async"
            style="
              position: relative;
              z-index: 1;
              box-sizing: border-box;
              width: 96px;
              height: 96px;
              padding: 18%;
              object-fit: contain;
              animation: boot-breathe 2.2s ease-in-out 420ms infinite;
            "
          />
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-enter {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.88;
          transform: scale(1.03);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash img {
          animation: none !important;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

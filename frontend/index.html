<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GateForge — Identity & Access</title>
    <!-- LCP / body use Manrope; Vite rewrites these to hashed assets on build -->
    <link
      rel="preload"
      href="/src/assets/fonts/manrope-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/src/assets/fonts/manrope-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root">
      <div
        class="boot-splash"
        role="status"
        aria-live="polite"
        aria-label="Loading GateForge"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: oklch(0.985 0.003 247);
        "
      >
        <div
          class="boot-splash-mark"
          style="
            position: relative;
            width: 96px;
            height: 96px;
            animation: boot-enter 420ms cubic-bezier(0.22, 1, 0.36, 1) both;
          "
        >
          <span
            class="boot-splash-ring"
            aria-hidden="true"
            style="
              position: absolute;
              inset: -10%;
              border-radius: 9999px;
              border: 1.5px solid color-mix(in oklab, oklch(0.4 0.18 265) 40%, transparent);
              animation: boot-ring 1.6s ease-out 420ms infinite;
            "
          ></span>
          <img
            src="/gateforge-icon.webp"
            alt=""
            width="96"
            height="96"
            decoding="async"
            style="
              position: relative;
              z-index: 1;
              box-sizing: border-box;
              width: 96px;
              height: 96px;
              padding: 18%;
              object-fit: contain;
              animation: boot-breathe 1.6s ease-in-out 420ms infinite;
            "
          />
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-enter {
        from {
          opacity: 0;
          transform: scale(0.72);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
          filter: drop-shadow(0 0 0 transparent);
        }
        50% {
          transform: scale(1.06);
          filter: drop-shadow(0 0 12px oklch(0.4 0.18 265 / 0.35));
        }
      }
      @keyframes boot-ring {
        0% {
          opacity: 0.55;
          transform: scale(0.85);
        }
        70%,
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-mark,
        .boot-splash img,
        .boot-splash-ring {
          animation: none !important;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

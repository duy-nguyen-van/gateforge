# GateForge IAM — public SDK OpenAPI 3.0.3 contract
# Full paths (no basePath). Excludes /api/v1/internal/* and /swagger/*.
openapi: 3.0.3
info:
  title: GateForge IAM API
  version: 0.1.0
  description: Public HTTP API for GateForge IAM — OpenID Connect / OAuth2 endpoints
    at the server root, plus the application JSON API under `/api/v1` (auth, MFA,
    WebAuthn, tenants, and platform admin). Success responses for `/api/v1` use a
    `{meta, data}` envelope. OAuth token and userinfo errors use `{error, error_description}`.
servers:
- url: http://localhost:3000
  description: Local development server
tags:
- name: Health
  description: Service and database health
- name: Auth
  description: Registration, login, refresh, logout, session exchange
- name: OIDC
  description: OpenID Connect discovery, authorize, token, userinfo, browser login
- name: Federation
  description: Upstream identity provider federation
- name: MFA
  description: TOTP enrollment, recovery codes, and login challenges
- name: WebAuthn
  description: Passkey registration and login
- name: Users
  description: Current user profile
- name: Tenants
  description: Tenant listing, selection, and switching
- name: Admin
  description: Platform admin console APIs
paths:
  "/.well-known/jwks.json":
    get:
      operationId: getJwks
      tags:
      - OIDC
      summary: JWKS endpoint (JSON Web Key Set)
      responses:
        '200':
          description: JWKS JSON
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JWKS"
  "/.well-known/openid-configuration":
    get:
      operationId: getOpenIdConfiguration
      tags:
      - OIDC
      summary: OpenID Configuration endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OpenIDConfigurationResponse"
  "/authorize":
    get:
      operationId: authorize
      tags:
      - OIDC
      summary: Authorize endpoint (authorization code + PKCE)
      security:
      - CookieAuth: []
      parameters:
      - name: response_type
        in: query
        schema:
          type: string
        description: Response type (code)
      - name: client_id
        in: query
        schema:
          type: string
        description: Client ID
      - name: redirect_uri
        in: query
        schema:
          type: string
        description: Redirect URI
      - name: scope
        in: query
        schema:
          type: string
        description: Scope
      - name: state
        in: query
        schema:
          type: string
        description: State parameter
      - name: nonce
        in: query
        schema:
          type: string
        description: Nonce
      - name: code_challenge
        in: query
        schema:
          type: string
        description: PKCE code challenge
      - name: code_challenge_method
        in: query
        schema:
          type: string
        description: PKCE method (S256)
      responses:
        '302':
          description: Redirect to client with code, or to login
          headers:
            Location:
              description: Redirect target
              schema:
                type: string
                format: uri
  "/oidc/login":
    post:
      operationId: loginOidc
      tags:
      - OIDC
      summary: Login (OIDC browser flow) and continue /authorize
      security:
      - CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '302':
          description: Redirect to return_to with session cookie set
          headers:
            Location:
              description: Redirect target
              schema:
                type: string
                format: uri
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/oidc/federation/{provider}/start":
    get:
      operationId: startFederationOAuth
      tags:
      - Federation
      summary: Start federated sign-in (OIDC browser flow)
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
        description: Provider id (e.g. google)
      - name: return_to
        in: query
        required: true
        schema:
          type: string
        description: URL to return to after login (must be /authorize on this app)
      responses:
        '302':
          description: Redirect to identity provider
          headers:
            Location:
              description: Redirect target
              schema:
                type: string
                format: uri
  "/oidc/federation/{provider}/callback":
    get:
      operationId: callbackFederationOAuth
      tags:
      - Federation
      summary: Federated OAuth callback
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
        description: Provider id (e.g. google)
      - name: code
        in: query
        required: true
        schema:
          type: string
        description: Authorization code
      - name: state
        in: query
        required: true
        schema:
          type: string
        description: State
      - name: error
        in: query
        schema:
          type: string
        description: OAuth error code from provider
      - name: error_description
        in: query
        schema:
          type: string
        description: OAuth error description from provider
      responses:
        '302':
          description: Redirect to stored return_to
          headers:
            Location:
              description: Redirect target
              schema:
                type: string
                format: uri
  "/token":
    post:
      operationId: createToken
      tags:
      - OIDC
      summary: Token endpoint (authorization_code / refresh_token grant)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              "$ref": "#/components/schemas/OIDCTokenRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OIDCTokenResponse"
        '400':
          description: Invalid request or grant
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OAuthError"
  "/userinfo":
    get:
      operationId: getUserInfo
      tags:
      - OIDC
      summary: Userinfo endpoint (Bearer access token from token endpoint, RS256)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserInfoResponse"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OAuthError"
  "/api/v1/":
    get:
      operationId: getHealth
      tags:
      - Health
      summary: Health Check
      description: Check if the service is running
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HealthEnvelope"
  "/api/v1/health/database":
    get:
      operationId: getDatabaseHealth
      tags:
      - Health
      summary: Database Health Check
      description: Check if the database connection is healthy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DatabaseHealthEnvelope"
  "/api/v1/health/metrics":
    get:
      operationId: getDatabaseMetrics
      tags:
      - Health
      summary: Database Connection Metrics
      description: Get detailed database connection metrics
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DatabaseMetricsEnvelope"
  "/api/v1/register":
    post:
      operationId: registerUser
      tags:
      - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponseEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/login":
    post:
      operationId: login
      tags:
      - Auth
      summary: Login (dashboard/API) with email and password
      description: Sets the same iam_session cookie as OIDC so /authorize recognizes
        the browser without a second login. If the user has MFA (TOTP) enabled, `data`
        is MFALoginChallengeResponse (mfa_ticket) instead of LoginResponse; complete
        login with POST /api/v1/mfa/challenge/verify. When the user belongs to multiple
        tenants and no tenant context is provided, `data` is TenantSelectionResponse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: LoginResponse, MFALoginChallengeResponse, or TenantSelectionResponse
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResultEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/login/session":
    post:
      operationId: exchangeSession
      tags:
      - Auth
      summary: Exchange iam_session cookie for API tokens (after federated sign-in)
      description: Reads the browser iam_session cookie and returns JWT tokens for
        the SPA dashboard.
      security:
      - CookieAuth: []
      responses:
        '200':
          description: LoginResponse or TenantSelectionResponse
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResultEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/federation/providers":
    get:
      operationId: listFederationProviders
      tags:
      - Federation
      summary: List enabled federation sign-in methods for a tenant
      parameters:
      - name: tenant_id
        in: query
        schema:
          type: string
        description: Tenant UUID (defaults to DEFAULT_TENANT_ID)
      - name: page
        in: query
        schema:
          type: integer
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
        description: Page size
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PublicFederationProviderListEnvelope"
  "/api/v1/refresh":
    post:
      operationId: refreshToken
      tags:
      - Auth
      summary: Exchange refresh token for a new access token (and rotated refresh
        token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RefreshTokenRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponseEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/webauthn/login/start":
    post:
      operationId: startWebauthnLogin
      tags:
      - WebAuthn
      summary: Begin passkey login
      description: Returns WebAuthn PublicKeyCredentialRequestOptions as `data.options`
        and a `session_token` for login/finish. Public endpoint (rate limited).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebauthnLoginStartRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnLoginStartEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/webauthn/login/finish":
    post:
      operationId: finishWebauthnLogin
      tags:
      - WebAuthn
      summary: Finish passkey login
      description: 'Verifies the assertion. On success without MFA: returns `data`
        as LoginResponse and sets `iam_session` cookie. When MFA is enabled for the
        user, returns MFALoginChallengeResponse in `data` instead (then call POST
        /api/v1/mfa/challenge/verify).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebauthnLoginFinishRequest"
      responses:
        '200':
          description: LoginResponse, MFALoginChallengeResponse, or TenantSelectionResponse
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResultEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/mfa/challenge/verify":
    post:
      operationId: verifyMfaChallenge
      tags:
      - MFA
      summary: Complete MFA after password or passkey login
      description: Consumes the `mfa_ticket` from password or passkey login when MFA
        is required. `code` is a 6-digit TOTP, or a recovery code (non–6-digit path).
        On success returns LoginResponse and sets `iam_session` cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MFAChallengeVerifyRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponseEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/logout":
    post:
      operationId: logout
      tags:
      - Auth
      summary: Log out everywhere for the current user (SSO session + all refresh
        tokens)
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MetaOnlyEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/me":
    get:
      operationId: getMe
      tags:
      - Users
      summary: Current user profile
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponseEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateMe
      tags:
      - Users
      summary: Update current user profile
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateProfileRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserResponseEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/me/tenants":
    get:
      operationId: listMyTenants
      tags:
      - Tenants
      summary: List tenants the current user can access
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
        description: Page size
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TenantSummaryListEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/tenants/select":
    post:
      operationId: selectTenant
      tags:
      - Tenants
      summary: Complete login by selecting a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TenantSelectRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponseEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/tenants/switch":
    post:
      operationId: switchTenant
      tags:
      - Tenants
      summary: Switch active tenant and re-issue tokens
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TenantSwitchRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/LoginResponseEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/webauthn/credentials":
    get:
      operationId: listWebauthnCredentials
      tags:
      - WebAuthn
      summary: List registered passkeys
      description: Returns passkeys registered for the current user (device label
        and created date only).
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
        description: Page size
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnCredentialListEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/webauthn/register/start":
    post:
      operationId: startWebauthnRegister
      tags:
      - WebAuthn
      summary: Begin passkey registration
      security:
      - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebauthnRegisterStartRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WebauthnRegisterStartEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/webauthn/register/finish":
    post:
      operationId: finishWebauthnRegister
      tags:
      - WebAuthn
      summary: Finish passkey registration
      description: Verifies the attestation and stores the passkey for the current
        user.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WebauthnRegisterFinishRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmptyDataEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/mfa/totp/setup":
    post:
      operationId: setupTotp
      tags:
      - MFA
      summary: Start TOTP enrollment
      description: Generates a TOTP secret, persists it (encrypted) as pending, and
        returns the raw secret plus otpauth URI for QR scanning.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MFATOTPSetupEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/mfa/totp/verify":
    post:
      operationId: verifyTotpEnrollment
      tags:
      - MFA
      summary: Confirm TOTP enrollment
      description: Validates a 6-digit code against the pending secret and enables
        TOTP for the user.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MFATOTPVerifyRequest"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EmptyDataEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/mfa/recovery-codes":
    post:
      operationId: createMfaRecoveryCodes
      tags:
      - MFA
      summary: Generate MFA recovery codes
      description: Replaces any existing recovery codes. Requires TOTP to be enabled.
        Plain codes are returned once; only hashes are stored.
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MFARecoveryCodesEnvelope"
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/admin/stats":
    get:
      operationId: getAdminStats
      tags:
      - Admin
      summary: Platform admin dashboard stats
      security:
      - BearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminStatsEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/admin/users":
    get:
      operationId: listAdminUsers
      tags:
      - Admin
      summary: List users (platform admin)
      security:
      - BearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
        description: Page number
      - name: page_size
        in: query
        schema:
          type: integer
        description: Page size
      - name: tenant_id
        in: query
        schema:
          type: string
        description: Filter by tenant UUID
      - name: search
        in: query
        schema:
          type: string
        description: Search email or name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserListEnvelope"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorEnvelope"
  "/api/v1/admin/users/{userId}":
    get:
      operationId: getAdminUser
      tags:
      - Admin
      summary: Get user details (platform admin)
      security:
      - BearerAuth: []
      parameters:
      - name: userId
        in: path
        required: true
